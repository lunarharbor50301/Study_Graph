entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: proxy
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: studygraph-agent
  general:
    - partition=tacc
    - exclude=10-0-1-10
    - nodes=1
    - ntasks=1
    - cpus-per-task=8
    - gres=gpu:2
    - time=01:00:00
    - output=${TACC_SLURM_USERLOG}/studygraph-agent-%j.log
